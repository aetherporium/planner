<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>እቅድ</title>
<style>
:root{
  --ink:#16181d;--body:#4a4f5a;--muted:#7b8290;--faint:#a8aeba;
  --line:#e8eaef;--hair:#f1f3f6;--bg:#faf9f7;--panel:#fff;
  --accent:#1f6f5c;--accent-2:#2d8a73;--soft:#eaf4f1;--ring:#cde5dd;
  --gold:#a8813a;--goldsoft:#faf3e6;--rose:#a44a3f;--rosesoft:#fbeeec;
  --r:14px;--rs:10px;
  --sh:0 1px 2px rgba(20,25,35,.04),0 4px 14px rgba(20,25,35,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:16px/1.65 "Noto Sans Ethiopic","Nyala",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:var(--rs);
  background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
::placeholder{color:var(--faint)}

.page{max-width:660px;margin:0 auto;padding:28px 20px 120px}

/* ── breadcrumb / interlinked nav ── */
.crumb{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);
  margin-bottom:20px;flex-wrap:wrap}
.crumb a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;cursor:pointer}
.crumb a:hover{border-bottom-color:var(--accent)}
.crumb .sep{color:var(--faint)}

h1{font-size:27px;margin:0;letter-spacing:-.01em;font-weight:700;line-height:1.25}
.sub{color:var(--muted);font-size:14.5px;margin:5px 0 0}
.hero{margin-bottom:24px}

/* ── the day rail ── */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh)}
.slot{display:flex;gap:13px;padding:14px 16px;border-bottom:1px solid var(--hair);align-items:flex-start}
.slot:last-child{border-bottom:none}
.slot.past{background:#fcfcfb}
.slot.past .name{color:var(--body)}
.slot.now{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.tcol{width:52px;flex-shrink:0;padding-top:1px}
.tp{font-variant-numeric:tabular-nums;font-size:14px;color:var(--body);font-weight:600;letter-spacing:-.01em}
.ta{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--accent);margin-top:1px}
.mid{flex:1;min-width:0}
.name{font-size:16px;line-height:1.4;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.name.done{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}
.name.skip{color:var(--faint)}
.det{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.det .dot{color:var(--faint)}
.logged{font-size:12px;color:var(--faint);margin-top:3px}

.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
  background:#fff;color:var(--muted);white-space:nowrap;line-height:1.6}
.chip.def{background:var(--soft);color:var(--accent);border-color:var(--ring)}
.chip.unp{background:var(--goldsoft);color:var(--gold);border-color:#eddfc2}
.chip.mv{background:var(--rosesoft);color:var(--rose);border-color:#f0d5d1}
.chip.off{background:var(--hair);color:var(--faint)}

.acts{display:flex;gap:6px;flex-shrink:0;align-items:center}
.b{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;
  font-size:13px;color:var(--body);transition:.12s}
.b:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.b:disabled{opacity:.32;cursor:not-allowed}
.b.yes{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.b.no{background:var(--hair);border-color:var(--line);color:var(--body);font-weight:600}
.b.icon{padding:6px 10px}

/* gaps */
.gap{display:flex;gap:13px;padding:9px 16px;font-size:13px;color:var(--faint);
  background:#fcfcfb;border-bottom:1px solid var(--hair);align-items:center}
.gap .tcol{font-variant-numeric:tabular-nums;font-size:12px}
.gap.travel{background:var(--goldsoft);color:var(--gold)}
.gap.overlap{background:var(--rosesoft);color:var(--rose)}

/* quick add */
.qa{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-top:18px;box-shadow:var(--sh)}
.qarow{display:flex;gap:9px}
.qarow input[type=text]{flex:1}
.qarow .b.yes{padding:11px 20px;border-radius:var(--rs)}
.expand{background:none;border:none;color:var(--accent);font-size:13.5px;padding:10px 0 0;
  display:block;text-align:right;width:100%}
.more{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);
  grid-template-columns:1fr 1fr;gap:10px}
.more.open{display:grid}
.more .full{grid-column:1/-1}
.lbl{font-size:12px;color:var(--muted);margin-bottom:5px;display:block}

/* link cards */
.links{display:grid;gap:10px;margin-top:22px}
.lk{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;text-align:right;width:100%;box-shadow:var(--sh);transition:.14s}
.lk:hover{border-color:var(--accent);transform:translateY(-1px)}
.lk .ic{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;
  place-items:center;flex-shrink:0;font-size:18px}
.lk .lt{flex:1}
.lk .lt b{display:block;font-size:15.5px;font-weight:600}
.lk .lt span{font-size:13px;color:var(--muted)}
.lk .ar{color:var(--faint);font-size:19px}

/* calendar */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh)}
.calhd{display:flex;align-items:center;gap:10px;padding:16px}
.calhd .mo{flex:1;text-align:center}
.calhd .mo b{display:block;font-size:17px;font-weight:700}
.calhd .mo span{font-size:12.5px;color:var(--muted)}
.nav{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;
  display:grid;place-items:center;color:var(--body);flex-shrink:0}
.nav:hover{border-color:var(--accent);color:var(--accent)}
.dows{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 6px}
.dows div{text-align:center;font-size:11px;color:var(--faint);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px 14px}
.cell{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;padding:0}
.cell:hover{background:var(--hair)}
.cell .p{font-size:15px;font-variant-numeric:tabular-nums;line-height:1.15;font-weight:600}
.cell .s{font-size:9.5px;color:var(--faint);line-height:1.1;font-variant-numeric:tabular-nums}
.cell.wknd .p{color:var(--rose)}
.cell.today{border-color:var(--accent)}
.cell.sel{background:var(--accent)}
.cell.sel .p,.cell.sel .s{color:#fff}
.cell.sel.wknd .p{color:#fff}
.cell.hol::after{content:"";position:absolute;top:5px;left:5px;width:5px;height:5px;
  border-radius:50%;background:var(--gold)}
.callg{display:flex;gap:14px;padding:12px 16px;border-top:1px solid var(--hair);
  font-size:12px;color:var(--muted);flex-wrap:wrap}
.callg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:5px;background:var(--gold)}

/* blueprint index */
.bp{display:grid;gap:10px}
.bpr{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;width:100%;text-align:right;box-shadow:var(--sh);transition:.14s}
.bpr:hover{border-color:var(--accent);transform:translateY(-1px)}
.bpr .n{flex:1}
.bpr .n b{display:block;font-size:15.5px;font-weight:600}
.bpr .n span{font-size:13px;color:var(--muted)}
.bpr .c{font-size:13px;color:var(--accent);background:var(--soft);padding:3px 11px;
  border-radius:99px;border:1px solid var(--ring);font-variant-numeric:tabular-nums}
.bpr .c.zero{background:var(--hair);color:var(--faint);border-color:var(--line)}

.hint{font-size:13.5px;color:var(--muted);background:var(--soft);border:1px solid var(--ring);
  border-radius:var(--rs);padding:12px 14px;margin-top:16px;line-height:1.6}
.empty{padding:34px 20px;text-align:center;color:var(--faint);font-size:14.5px}

/* clock */
.clock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16181d;
  color:#fff;border-radius:99px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 32px rgba(0,0,0,.26);z-index:50;font-size:13.5px}
.clock span{color:#9aa3b2}
.clock input{width:78px;background:#262a33;border:1px solid #363b47;color:#fff;
  padding:5px 9px;border-radius:99px;font-size:13px;text-align:center}
.clock input:focus{border-color:var(--accent-2);box-shadow:none}

dialog{border:none;border-radius:18px;padding:0;box-shadow:0 24px 70px rgba(0,0,0,.3);
  max-width:400px;width:92vw;background:var(--panel)}
dialog::backdrop{background:rgba(16,20,28,.5)}
.dlg{padding:22px}
.dlg h4{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 18px;font-size:14px;color:var(--muted);line-height:1.6}
.frow{margin-bottom:12px}
.dacts{display:flex;gap:9px;justify-content:flex-start;margin-top:20px}
.ghost{background:#fff;border:1px solid var(--line);border-radius:var(--rs);padding:11px 18px;color:var(--body)}
.solid{background:var(--accent);border:1px solid var(--accent);border-radius:var(--rs);
  padding:11px 20px;color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="clock"><span>አሁን</span><input type="time" id="nowt" value="14:00" /></div>
<dialog id="dlg"><div class="dlg" id="dbody"></div></dialog>

<script type="module">
// ═══ calendar core (mirrors src/calendar.mjs) ═══
const EC_M=["መስከረም","ጥቅምት","ኅዳር","ታኅሣሥ","ጥር","የካቲት","መጋቢት","ሚያዝያ","ግንቦት","ሰኔ","ሐምሌ","ነሐሴ","ጳጉሜን"];
const GC_M=["ጃንዩወሪ","ፌብሩወሪ","ማርች","ኤፕሪል","ሜይ","ጁን","ጁላይ","ኦገስት","ሴፕቴምበር","ኦክቶበር","ኖቬምበር","ዲሴምበር"];
const DOW=["እሑድ","ሰኞ","ማክሰኞ","ረቡዕ","ሐሙስ","ዓርብ","ቅዳሜ"];
const DOW2=["እሑ","ሰኞ","ማክ","ረቡ","ሐሙ","ዓር","ቅዳ"];
const EPOCH=1724220;
const ecLeap=y=>((y%4)+4)%4===3;
const ecLen=(y,m)=>m===13?(ecLeap(y)?6:5):30;
const g2j=(y,m,d)=>{const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045};
const j2g=j=>{const a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),
  d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);
  return{y:100*b+d-4800+Math.floor(m/10),m:m+3-12*Math.floor(m/10),d:e-Math.floor((153*m+2)/5)+1}};
const e2j=(y,m,d)=>EPOCH+365*(y-1)+Math.floor(y/4)+30*(m-1)+d;
const j2e=j=>{let y=Math.floor((j-EPOCH-1)/365.25)+1;
  while(e2j(y+1,1,1)<=j)y++;while(e2j(y,1,1)>j)y--;
  const n=j-e2j(y,1,1);return{y,m:Math.floor(n/30)+1,d:n%30+1}};
const EC_H=[{m:1,d:1,n:"እንቁጣጣሽ"},{m:1,d:17,n:"መስቀል"},{m:4,d:29,n:"ገና"},{m:5,d:11,n:"ጥምቀት"},
  {m:6,d:23,n:"ዓድዋ"},{m:8,d:23,n:"የሠራተኞች ቀን"},{m:8,d:27,n:"የአርበኞች ቀን"}];
const GC_H=[{m:1,d:1,n:"አዲስ ዓመት (ግሪጎሪ)"},{m:12,d:25,n:"ገና (ግሪጎሪ)"}];
const EXTRA={};
const iso=({y,m,d})=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const day=j=>{const gc=j2g(j),ec=j2e(j),i=iso(gc);
  const hol=[...EC_H.filter(h=>h.m===ec.m&&h.d===ec.d).map(h=>h.n),
    ...GC_H.filter(h=>h.m===gc.m&&h.d===gc.d).map(h=>h.n),...(EXTRA[i]??[])];
  const dw=(j+1)%7;
  return{jdn:j,iso:i,gc,ec,ecM:EC_M[ec.m-1],gcM:GC_M[gc.m-1],dow:dw,dowN:DOW[dw],
    wknd:dw===0||dw===6,hol}};
const dayG=(y,m,d)=>day(g2j(y,m,d));
const dayE=(y,m,d)=>day(e2j(y,m,d));

// ═══ blueprint (mirrors src/blueprint.mjs) ═══
const fires=(r,d)=>{if(!r)return false;switch(r.kind){
  case"everyday":return true;case"weekday":return !d.wknd;case"weekend":return d.wknd;
  case"dow":return d.dow===r.dow;case"gc-monthday":return d.gc.d===r.day;
  case"ec-monthday":return d.ec.d===r.day;
  case"holiday":return r.name?d.hol.includes(r.name):d.hol.length>0;
  case"dates":return r.dates.includes(d.iso);default:return false}};
const RULES=[
  {id:"everyday",label:"በየቀኑ",desc:"ሁሉም ቀን",rule:{kind:"everyday"}},
  {id:"weekday",label:"የሥራ ቀናት",desc:"ሰኞ – ዓርብ",rule:{kind:"weekday"}},
  {id:"weekend",label:"ቅዳሜና እሑድ",desc:"ሳምንቱ መጨረሻ",rule:{kind:"weekend"}},
  {id:"dow0",label:"በየእሑድ",desc:"በየሳምንቱ እሑድ",rule:{kind:"dow",dow:0}},
  {id:"dow1",label:"በየሰኞ",desc:"በየሳምንቱ ሰኞ",rule:{kind:"dow",dow:1}},
  {id:"dow5",label:"በየዓርብ",desc:"በየሳምንቱ ዓርብ",rule:{kind:"dow",dow:5}},
  {id:"ec1",label:"በየወሩ 1",desc:"የኢትዮጵያ ወር መጀመሪያ",rule:{kind:"ec-monthday",day:1}},
  {id:"gc1",label:"በየወሩ 1 (ግሪጎሪ)",desc:"የግሪጎሪ ወር መጀመሪያ",rule:{kind:"gc-monthday",day:1}},
  {id:"holiday",label:"በዓላት",desc:"ሁሉም በዓል",rule:{kind:"holiday"}},
];
const ruleFromFreq=(f,d)=>({once:null,everyday:{kind:"everyday"},weekday:{kind:"weekday"},
  weekend:{kind:"weekend"},weekly:{kind:"dow",dow:d.dow},
  ecmonth:{kind:"ec-monthday",day:d.ec.d},gcmonth:{kind:"gc-monthday",day:d.gc.d},
  holiday:{kind:"holiday"}})[f]??null;
const ruleLabel=r=>{if(!r)return"አንድ ጊዜ";
  const m=RULES.find(x=>JSON.stringify(x.rule)===JSON.stringify(r));
  if(m)return m.label;
  switch(r.kind){case"dow":return"በየ"+DOW[r.dow];
    case"ec-monthday":return`በየወሩ ${r.day}`;case"gc-monthday":return`በየወሩ ${r.day} (ግሪጎሪ)`;
    default:return"ልማድ"}};

// ═══ log (mirrors src/log.mjs) ═══
const ST={UNKNOWN:"unknown",DONE:"done",SKIPPED:"skipped",RESCHEDULED:"rescheduled"};
const fmtT=m=>m==null?"—":`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const fmtD=m=>m==null?"—":m<60?`${m}ደ`:`${Number.isInteger(m/60)?m/60:(m/60).toFixed(1)}ሰ`;
const parseT=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());
  if(!m)return null;const h=+m[1],i=+m[2];return h>23||i>59?null:h*60+i};
const canDo=({dayJdn,actualMin},now)=>{
  if(dayJdn>now.jdn)return{ok:false,why:"ያ ቀን ገና አልደረሰም።"};
  if(dayJdn===now.jdn&&actualMin!=null&&actualMin>now.minutes)
    return{ok:false,why:`አሁን ${fmtT(now.minutes)} ነው። ${fmtT(actualMin)} ላይ የተደረገ ነገር ገና መመዝገብ አይቻልም።`};
  return{ok:true}};
const GAP={REST:"rest",TRAVEL:"travel"};
const timeline=(ts,{s0=300,s1=1440}={})=>{
  const p=ts.filter(t=>t.startMin!=null).sort((a,b)=>a.startMin-b.startMin);
  const out=[];let cur=s0;
  for(const t of p){const g=t.startMin-cur;
    if(g>0){const pv=out.length?out[out.length-1]:null;
      const mv=pv&&pv.kind==="task"&&pv.task.place&&t.place&&pv.task.place!==t.place;
      out.push({kind:"gap",gapKind:mv?GAP.TRAVEL:GAP.REST,startMin:cur,endMin:t.startMin,
        durationMin:g,from:mv?pv.task.place:null,to:mv?t.place:null})}
    else if(g<0)out.push({kind:"overlap",startMin:t.startMin,durationMin:-g});
    out.push({kind:"task",task:t,startMin:t.startMin});
    cur=Math.max(cur,t.startMin+(t.duration??0))}
  if(cur<s1)out.push({kind:"gap",gapKind:GAP.REST,startMin:cur,endMin:s1,durationMin:s1-cur});
  return out};
const statusOf=(es,tid,j)=>{const f=es.filter(e=>e.taskId===tid&&e.dayJdn===j);
  return f.length?f[f.length-1]:null};

// ═══ defaults (mirrors src/defaults.mjs) — ATOMIC: one activity each ═══
const DEFAULTS=[
  {key:"wake",title:"መነሳት",startMin:360,duration:5,place:"ቤት"},
  {key:"breakfast",title:"ቁርስ",startMin:420,duration:30,place:"ቤት"},
  {key:"lunch",title:"ምሳ",startMin:750,duration:45,place:"ቤት"},
  {key:"dinner",title:"እራት",startMin:1170,duration:45,place:"ቤት"},
  {key:"sleep",title:"እንቅልፍ",startMin:1350,duration:450,place:"ቤት"},
];

// ═══ state — NO seeded history. Empty until the user acts. ═══
let uid=0;const nid=p=>`${p}${++uid}`;
const TODAY=dayG(2026,8,14);
let nowMin=14*60;
let route={name:"today"};
let selJdn=TODAY.jdn;
let anchor={...j2e(TODAY.jdn)};
const disabled=new Set();
const tasks=DEFAULTS.map(d=>({...d,id:"default:"+d.key,rule:{kind:"everyday"},isDefault:true}));
const entries=[];

const now=()=>({jdn:TODAY.jdn,minutes:nowMin});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=i=>document.getElementById(i);
const live=t=>!(t.isDefault&&disabled.has(t.key));
const forDay=d=>tasks.filter(t=>live(t)&&(t.rule?fires(t.rule,d):t.onJdn===d.jdn))
  .sort((a,b)=>(a.startMin??0)-(b.startMin??0));
const go=r=>{route=r;window.scrollTo(0,0);render()};

// ═══ actions ═══
function setStatus(tid,j,st,plannedMin){
  if(st===ST.DONE){
    const c=canDo({dayJdn:j,actualMin:plannedMin},now());
    if(!c.ok)return say("ገና አልተቻለም",c.why);
  }
  const prev=statusOf(entries,tid,j);
  if(prev&&prev.status===st){entries.splice(entries.indexOf(prev),1);return render()}
  entries.push({id:nid("e"),taskId:tid,dayJdn:j,status:st,plannedMin:plannedMin??null,
    actualMin:st===ST.DONE?plannedMin??null:null,durationMin:null,unplanned:false,
    loggedAtJdn:now().jdn,loggedAtMin:now().minutes});
  render();
}
function say(h,p){$("dbody").innerHTML=`<h4>${esc(h)}</h4><p>${esc(p)}</p>
  <div class="dacts"><button class="solid" id="k">እሺ</button></div>`;
  $("dlg").showModal();$("k").onclick=()=>$("dlg").close()}

function editActual(tid,j){
  const t=tasks.find(x=>x.id===tid);const e=statusOf(entries,tid,j);
  $("dbody").innerHTML=`<h4>የተከናወነበት ሰዓት</h4>
    <p>የታቀደው ${fmtT(t?.startMin)} ነበር። በትክክል የተከናወነው መቼ ነው?</p>
    <div class="frow"><input type="time" id="ta" value="${fmtT(e?.actualMin??t?.startMin??0)}" /></div>
    <div class="dacts"><button class="ghost" id="c">ተወው</button><button class="solid" id="s">አስቀምጥ</button></div>`;
  $("dlg").showModal();$("c").onclick=()=>$("dlg").close();
  $("s").onclick=()=>{const v=parseT($("ta").value);if(v==null)return;
    const c=canDo({dayJdn:j,actualMin:v},now());
    if(!c.ok){$("dlg").close();return say("ገና አልተቻለም",c.why)}
    entries.push({id:nid("e"),taskId:tid,dayJdn:j,status:ST.DONE,plannedMin:t?.startMin??null,
      actualMin:v,durationMin:null,unplanned:false,loggedAtJdn:now().jdn,loggedAtMin:now().minutes});
    $("dlg").close();render()};
}
function logUnplanned(){
  const d=day(selJdn);
  $("dbody").innerHTML=`<h4>ያልታቀደ ነገር መዝግብ</h4>
    <p>አልታቀደም ነበር — ችግር የለም። ይህ የሆነውን ይመዘግባል፣ አይቀጣም።</p>
    <div class="frow"><span class="lbl">ምን</span><input id="u_t" placeholder="ለምሳሌ፦ ቧንቧ ጠገንኩ" /></div>
    <div class="frow"><span class="lbl">የተከናወነበት ሰዓት</span><input type="time" id="u_a" value="${fmtT(Math.min(nowMin,1439))}" /></div>
    <div class="frow"><span class="lbl">ደቂቃ</span><input type="number" id="u_d" value="30" min="0" step="5" /></div>
    <div class="dacts"><button class="ghost" id="c">ተወው</button><button class="solid" id="s">መዝግብ</button></div>`;
  $("dlg").showModal();$("c").onclick=()=>$("dlg").close();
  $("s").onclick=()=>{const ttl=$("u_t").value.trim();if(!ttl)return;
    const a=parseT($("u_a").value)??0;
    const c=canDo({dayJdn:d.jdn,actualMin:a},now());
    if(!c.ok){$("dlg").close();return say("ገና አልተቻለም",c.why)}
    entries.push({id:nid("e"),taskId:nid("x"),dayJdn:d.jdn,status:ST.DONE,plannedMin:null,
      actualMin:a,durationMin:+$("u_d").value||0,unplanned:true,title:ttl,
      loggedAtJdn:now().jdn,loggedAtMin:now().minutes});

function reschedule(tid,j){
  $("dbody").innerHTML=`<h4>ወደ ሌላ ቀን አዛውር</h4>
    <p>ማዛወር ውድቀት አይደለም። መቼ እንደሚሆን ብቻ ንገረኝ።</p>
    <div class="frow"><input type="date" id="r_d" value="${day(j+1).iso}" /></div>
    <div class="dacts"><button class="ghost" id="c">ተወው</button><button class="solid" id="s">አዛውር</button></div>`;
  $("dlg").showModal();$("c").onclick=()=>$("dlg").close();
  $("s").onclick=()=>{const[y,m,dd]=$("r_d").value.split("-").map(Number);
    entries.push({id:nid("e"),taskId:tid,dayJdn:j,status:ST.RESCHEDULED,plannedMin:null,actualMin:null,
      durationMin:null,unplanned:false,movedToJdn:g2j(y,m,dd),loggedAtJdn:now().jdn,loggedAtMin:now().minutes});
    $("dlg").close();render()};

// ═══ shared pieces ═══
const crumb=parts=>`<nav class="crumb">${parts.map((p,i)=>
  (i?`<span class="sep">›</span>`:"")+(p.go?`<a data-go='${esc(JSON.stringify(p.go))}'>${esc(p.t)}</a>`
  :`<span>${esc(p.t)}</span>`)).join("")}</nav>`;

function slot(t,d,cls){
  const e=statusOf(entries,t.id,d.jdn);
  const st=e?e.status:ST.UNKNOWN;
  const future=d.jdn>now().jdn||(d.jdn===now().jdn&&(t.startMin??0)>nowMin);
  const drift=e&&e.status===ST.DONE&&e.actualMin!=null&&e.actualMin!==t.startMin;
  return `<div class="slot ${cls}">
    <div class="tcol">
      <div class="tp">${fmtT(t.startMin)}</div>
      ${drift?`<div class="ta">${fmtT(e.actualMin)}</div>`:""}
    </div>
    <div class="mid">
      <div class="name ${st===ST.DONE?"done":st===ST.SKIPPED?"skip":""}">${esc(t.title)}
        ${t.isDefault?`<span class="chip def">መሠረታዊ</span>`:""}
        ${st===ST.RESCHEDULED?`<span class="chip mv">ተዛውሯል</span>`:""}
      </div>
      <div class="det"><span>${fmtD(t.duration)}</span>
        ${t.place?`<span class="dot">·</span><span>${esc(t.place)}</span>`:""}</div>
      ${e&&e.loggedAtMin!=null&&st===ST.DONE
        ?`<div class="logged">የተመዘገበበት ${fmtT(e.loggedAtMin)}${e.loggedAtJdn!==d.jdn?" (በሌላ ቀን)":""}</div>`:""}
    </div>
    <div class="acts">
      <button class="b ${st===ST.DONE?"yes":""}" data-done="${t.id}" data-j="${d.jdn}" data-p="${t.startMin??0}"
        ${future&&st!==ST.DONE?"disabled":""}>${st===ST.DONE?"✓":"አዎ"}</button>
      <button class="b ${st===ST.SKIPPED?"no":""}" data-skip="${t.id}" data-j="${d.jdn}">የለም</button>
      <button class="b icon" data-menu="${t.id}" data-j="${d.jdn}">⋯</button>
    </div>
  </div>`;
}

function rail(d,{showNow}={}){
  const list=forDay(d);
  const unp=entries.filter(e=>e.dayJdn===d.jdn&&e.unplanned);
  if(!list.length&&!unp.length)
    return `<div class="rail"><div class="empty">ለዚህ ቀን ምንም የለም።<br/>ባዶ ቀን ትክክለኛ ቀን ነው።</div></div>`;
  let h="";
  for(const s of timeline(list)){
    if(s.kind==="gap"){
      if(s.durationMin<20)continue;
      h+=`<div class="gap ${s.gapKind}"><div class="tcol">${fmtT(s.startMin)}</div>
        <div>${s.gapKind===GAP.TRAVEL
          ?`ጉዞ ${esc(s.from)} → ${esc(s.to)} · ${fmtD(s.durationMin)}`
          :`ዕረፍት · ${fmtD(s.durationMin)}`}</div></div>`;
    } else if(s.kind==="overlap"){
      h+=`<div class="gap overlap"><div class="tcol">${fmtT(s.startMin)}</div>
        <div>መደራረብ · ${fmtD(s.durationMin)}</div></div>`;
    } else {
      const t=s.task;
      const cur=showNow&&t.startMin<=nowMin&&nowMin<t.startMin+(t.duration??0);
      const past=showNow&&t.startMin+(t.duration??0)<=nowMin;
      h+=slot(t,d,cur?"now":past?"past":"");
    }
  }
  for(const e of unp)h+=`<div class="slot">
    <div class="tcol"><div class="tp">${fmtT(e.actualMin)}</div></div>
    <div class="mid"><div class="name">${esc(e.title)} <span class="chip unp">ያልታቀደ</span></div>
      <div class="det"><span>${fmtD(e.durationMin)}</span></div>
      <div class="logged">የተመዘገበበት ${fmtT(e.loggedAtMin)}</div></div></div>`;
  return `<div class="rail">${h}</div>`;
}

// ═══ PAGE: today ═══
function pageToday(){
  const d=day(selJdn);
  const isT=d.jdn===TODAY.jdn;
  return crumb([{t:"እቅድ"},{t:isT?"ዛሬ":d.dowN}])
    +`<div class="hero">
      <h1>${isT?"ዛሬ":d.dowN}</h1>
      <p class="sub">${d.ec.d} ${d.ecM} ${d.ec.y} · ${d.gc.d} ${d.gcM} ${d.gc.y}
        ${d.hol.length?` · ${esc(d.hol.join("፣ "))}`:""}</p>
    </div>`
    +rail(d,{showNow:isT})
    +quickAdd(d)
    +`<div class="links">
      <button class="lk" data-go='{"name":"calendar"}'>
        <span class="ic">📅</span><span class="lt"><b>የቀን መቁጠሪያ</b>
        <span>ሌላ ቀን ምረጥ</span></span><span class="ar">›</span></button>
      <button class="lk" data-go='{"name":"blueprints"}'>
        <span class="ic">🧭</span><span class="lt"><b>ንድፍ</b>
        <span>ሁሌም የምታደርገው</span></span><span class="ar">›</span></button>
      <button class="lk" id="unp">
        <span class="ic">✓</span><span class="lt"><b>ያልታቀደ ነገር አደረግኩ</b>
        <span>ከተፈጸመ በኋላ መዝግብ</span></span><span class="ar">›</span></button>
    </div>`;
}

// ═══ PAGE: calendar ═══
function pageCalendar(){
  const {y,m}=anchor;
  const len=ecLen(y,m);
  const first=dayE(y,m,1);
  const last=dayE(y,m,len);
  const cells=[];
  for(let i=0;i<first.dow;i++)cells.push(null);
  for(let i=1;i<=len;i++)cells.push(dayE(y,m,i));
  const span=first.gc.m===last.gc.m?`${first.gcM} ${first.gc.y}`
    :`${first.gcM} – ${last.gcM} ${last.gc.y}`;
  return crumb([{t:"እቅድ",go:{name:"today"}},{t:"የቀን መቁጠሪያ"}])
    +`<div class="hero"><h1>የቀን መቁጠሪያ</h1>
      <p class="sub">ቀን ምረጥ፤ ያንን ቀን ምን እንደምታደርግ ታያለህ።</p></div>
    <div class="cal">
      <div class="calhd">
        <button class="nav" data-mo="-1">›</button>
        <div class="mo"><b>${EC_M[m-1]} ${y}</b><span>${span}</span></div>
        <button class="nav" data-mo="1">‹</button>
      </div>
      <div class="dows">${DOW2.map(x=>`<div>${x}</div>`).join("")}</div>
      <div class="days">${cells.map(c=>{
        if(!c)return `<div></div>`;
        return `<button class="cell ${c.jdn===selJdn?"sel":""} ${c.jdn===TODAY.jdn?"today":""}
          ${c.wknd?"wknd":""} ${c.hol.length?"hol":""}" data-pick="${c.jdn}"
          title="${esc(c.dowN)}${c.hol.length?" · "+esc(c.hol.join("፣ ")):""}">
          <span class="p">${c.ec.d}</span><span class="s">${c.gc.d}</span></button>`}).join("")}</div>
      <div class="callg"><span>ትልቁ ቁጥር፦ ኢትዮጵያ</span><span>ትንሹ፦ ግሪጎሪ</span>
        <span><i></i>በዓል</span></div>
    </div>`;
}

// ═══ PAGE: blueprint index ═══
function pageBlueprints(){
  const rows=RULES.map(r=>{
    const n=tasks.filter(t=>live(t)&&t.rule&&JSON.stringify(t.rule)===JSON.stringify(r.rule)).length;
    return `<button class="bpr" data-go='{"name":"blueprint","id":"${r.id}"}'>
      <span class="n"><b>${r.label}</b><span>${r.desc}</span></span>
      <span class="c ${n?"":"zero"}">${n}</span><span class="ar">›</span></button>`}).join("");
  return crumb([{t:"እቅድ",go:{name:"today"}},{t:"ንድፍ"}])
    +`<div class="hero"><h1>ንድፍ</h1>
      <p class="sub">በእያንዳንዱ ዓይነት ቀን ሁሌም የምታደርገው። እያንዳንዱ የራሱ ገጽ አለው።</p></div>
    <div class="bp">${rows}</div>
    <div class="hint">ተግባር ስትጨምር ድግግሞሽ ከሰጠኸው በራሱ ወደዚህ ይገባል።</div>`;
}

// ═══ PAGE: one blueprint ═══
function pageBlueprint(id){
  const r=RULES.find(x=>x.id===id);
  if(!r)return pageBlueprints();
  const mine=tasks.filter(t=>t.rule&&JSON.stringify(t.rule)===JSON.stringify(r.rule))
    .sort((a,b)=>(a.startMin??0)-(b.startMin??0));
  const rows=mine.length?mine.map(t=>{
    const off=t.isDefault&&disabled.has(t.key);
    return `<div class="slot">
      <div class="tcol"><div class="tp">${fmtT(t.startMin)}</div></div>
      <div class="mid"><div class="name ${off?"skip":""}">${esc(t.title)}
        ${t.isDefault?`<span class="chip ${off?"off":"def"}">መሠረታዊ</span>`:""}</div>
        <div class="det"><span>${fmtD(t.duration)}</span>
          ${t.place?`<span class="dot">·</span><span>${esc(t.place)}</span>`:""}</div></div>
      <div class="acts">${t.isDefault
        ?`<button class="b ${off?"":"yes"}" data-tog="${t.key}">${off?"አብራ":"በርቷል"}</button>`
        :`<button class="b" data-del="${t.id}">አስወግድ</button>`}</div>
    </div>`}).join("")
    :`<div class="empty">በዚህ ንድፍ ውስጥ ምንም የለም።</div>`;
  return crumb([{t:"እቅድ",go:{name:"today"}},{t:"ንድፍ",go:{name:"blueprints"}},{t:r.label}])
    +`<div class="hero"><h1>${r.label}</h1><p class="sub">${r.desc}</p></div>
    <div class="rail">${rows}</div>
    ${mine.some(t=>t.isDefault)?`<div class="hint">መሠረታዊ ተግባራት ሁሌም አሉ። ማጥፋት ትችላለህ — አይጠፉም፣ እንደጠፉ ይታያሉ።</div>`:""}`;
}

// ═══ render ═══
function render(){
  const r=route;
  $("app").innerHTML= r.name==="today"?pageToday()
    : r.name==="calendar"?pageCalendar()
    : r.name==="blueprints"?pageBlueprints()
    : r.name==="blueprint"?pageBlueprint(r.id) : pageToday();
  const g=$("q_go");
  if(g){
    const add=()=>{
      const t=$("q_t").value.trim();if(!t)return;
      const d=day(selJdn);
      const f=$("q_f")?$("q_f").value:"once";
      const rule=ruleFromFreq(f,d);
      const task={id:nid("t"),title:t,rule,
        startMin:$("q_a")?parseT($("q_a").value)??nowMin:nowMin,
        duration:$("q_d")?+$("q_d").value||0:30,
        place:$("q_p")?.value.trim()||null};
      if(!rule)task.onJdn=d.jdn;
      tasks.push(task);render();
    };
    g.onclick=add;
    $("q_t").onkeydown=e=>{if(e.key==="Enter")add()};
    $("q_x").onclick=()=>$("q_m").classList.toggle("open");
  }
  const u=$("unp");if(u)u.onclick=logUnplanned;
}

document.body.addEventListener("click",e=>{
  const el=e.target.closest("[data-go],[data-pick],[data-mo],[data-done],[data-skip],[data-menu],[data-tog],[data-del]");
  if(!el)return;
  if(el.dataset.go)return go(JSON.parse(el.dataset.go));
  if(el.dataset.pick){selJdn=+el.dataset.pick;return go({name:"today"})}
  if(el.dataset.mo){let{y,m}=anchor;m+=+el.dataset.mo;
    if(m>13){m=1;y++}if(m<1){m=13;y--}anchor={y,m};return render()}
  if(el.dataset.done)return setStatus(el.dataset.done,+el.dataset.j,ST.DONE,+el.dataset.p);
  if(el.dataset.skip)return setStatus(el.dataset.skip,+el.dataset.j,ST.SKIPPED);
  if(el.dataset.menu){
    const tid=el.dataset.menu,j=+el.dataset.j;
    $("dbody").innerHTML=`<h4>ተጨማሪ</h4><p>ስለዚህ ተግባር ምን ማድረግ ትፈልጋለህ?</p>
      <div class="dacts" style="flex-direction:column;align-items:stretch;gap:8px">
        <button class="ghost" id="m1">የተከናወነበትን ሰዓት አስተካክል</button>
        <button class="ghost" id="m2">ወደ ሌላ ቀን አዛውር</button>
      </div>`;
    $("dlg").showModal();
    $("m1").onclick=()=>{$("dlg").close();editActual(tid,j)};
    $("m2").onclick=()=>{$("dlg").close();reschedule(tid,j)};
    return;
  }
  if(el.dataset.tog){const k=el.dataset.tog;
    disabled.has(k)?disabled.delete(k):disabled.add(k);return render()}
  if(el.dataset.del){const i=tasks.findIndex(t=>t.id===el.dataset.del);
    if(i>=0)tasks.splice(i,1);return render()}
});
$("nowt").addEventListener("change",e=>{const v=parseT(e.target.value);if(v!=null){nowMin=v;render()}});
render();
</script>
</body>
</html>
