<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Planner — Day</title>
<style>
:root{
  --ink:#12151c;--muted:#697182;--faint:#9aa2b1;--line:#e5e8ee;--bg:#f6f7f9;--panel:#fff;
  --accent:#3d5afe;--soft:#eef1ff;--ok:#2f7a55;--oksoft:#e9f5ee;--warn:#b4531f;
  --warnsoft:#fdf0e8;--rest:#f2f4f7;--travel:#fff8e6;--travelink:#8a6d1f;--r:9px;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--soft);border-color:var(--accent)}

.top{background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px;display:flex;
  align-items:center;gap:6px;position:sticky;top:0;z-index:30}
.brand{font-weight:700;letter-spacing:-.02em;margin-right:14px}
.nav{padding:14px 14px;border:none;background:none;color:var(--muted);font-size:14px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.nav.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.clock{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:8px}
.clock input{padding:4px 7px;width:76px;font-size:13px}
.wrap{max-width:1120px;margin:0 auto;padding:20px}
.hd{display:flex;align-items:flex-start;gap:14px;margin-bottom:4px;flex-wrap:wrap}
h1{font-size:21px;margin:0;letter-spacing:-.02em}
.dual{font-size:13px;color:var(--muted);margin:2px 0 0}
.dual b{color:var(--ink)}
.hol{display:inline-block;background:var(--warnsoft);color:var(--warn);font-size:11px;
  padding:2px 8px;border-radius:99px;margin-left:6px;border:1px solid #f2d9c8}
.sub{color:var(--faint);font-size:13px;margin:8px 0 18px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;color:var(--muted)}
.pad{padding:14px}

/* now strip */
.strip{display:flex;flex-direction:column}
.slot{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid #f1f3f7;align-items:flex-start}
.slot:last-child{border-bottom:none}
.slot.past{opacity:.58}
.slot.current{background:var(--soft);border-left:3px solid var(--accent);padding-left:11px}
.slot .t{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);width:44px;flex-shrink:0;padding-top:2px}
.slot .body{flex:1;min-width:0}
.slot .ttl{font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.slot .ttl.done{text-decoration:line-through;color:var(--faint)}
.slot .meta{font-size:12px;color:var(--faint);margin-top:2px}
.acts{display:flex;gap:5px;flex-shrink:0}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font-size:12px;color:var(--muted)}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.on-done{background:var(--oksoft);border-color:#bfe0cd;color:var(--ok);font-weight:600}
.mini.on-skip{background:var(--rest);border-color:var(--line);color:var(--muted);font-weight:600}
.mini:disabled{opacity:.35;cursor:not-allowed}
.mini:disabled:hover{border-color:var(--line);color:var(--muted)}
.gap{display:flex;gap:11px;padding:7px 14px;font-size:12px;color:var(--faint);
  background:var(--rest);border-bottom:1px solid #f1f3f7;align-items:center}
.gap .t{width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.gap.travel{background:var(--travel);color:var(--travelink)}
.gap.overlap{background:var(--warnsoft);color:var(--warn)}
.badge{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--rest);
  color:var(--muted);border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.badge.bp{background:var(--soft);color:var(--accent);border-color:#d7ddff}
.badge.unp{background:var(--warnsoft);color:var(--warn);border-color:#f2d9c8}
.badge.unk{background:#fff;color:var(--faint)}

/* quick add */
.qa{display:flex;gap:6px;flex-wrap:wrap}
.qa input[type=text]{flex:1;min-width:130px}
.qa input[type=time]{width:96px}
.qa input[type=number]{width:66px}
.go{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:6px;padding:7px 14px}
.more{background:none;border:none;color:var(--accent);font-size:12px;padding:6px 0;text-align:left}
.det{display:none;gap:6px;flex-wrap:wrap;margin-top:8px}
.det.show{display:flex}

/* calendar */
.calhd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.calhd .nm{font-weight:600;font-size:14px;flex:1}
.calhd .nm span{display:block;font-size:11px;color:var(--faint);font-weight:400}
.arrow{border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;
  display:grid;place-items:center;color:var(--muted)}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 8px 0}
.dows div{text-align:center;font-size:10px;color:var(--faint);padding-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 8px 10px}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:6px;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:2px;position:relative}
.day:hover{background:var(--bg)}
.day .n{font-size:13px;font-variant-numeric:tabular-nums;line-height:1}
.day .alt{font-size:9px;color:var(--faint);line-height:1}
.day.sel{background:var(--accent);color:#fff}
.day.sel .alt{color:#c6cfff}
.day.today{border-color:var(--accent)}
.day.wknd .n{color:var(--warn)}
.day.sel.wknd .n{color:#fff}
.day.hol::after{content:"";position:absolute;top:3px;right:3px;width:4px;height:4px;
  border-radius:50%;background:var(--warn)}
.day .dot{width:14px;height:2px;border-radius:2px;background:var(--accent);opacity:.4}
.day.sel .dot{background:#fff;opacity:.8}
.swapcal{padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
.swapcal button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px;font-size:12px;color:var(--muted)}
.swapcal button.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* blueprint */
.bpitem{padding:10px 14px;border-bottom:1px solid #f1f3f7;display:flex;gap:9px;align-items:flex-start}
.bpitem:last-child{border-bottom:none}
.bpitem .w{flex:1}
.bprule{font-size:11px;color:var(--accent);background:var(--soft);padding:1px 7px;
  border-radius:99px;display:inline-block;margin-top:3px;border:1px solid #d7ddff}
.kinds{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-bottom:1px solid var(--line)}
.kinds button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;
  font-size:12px;color:var(--muted)}
.kinds button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;background:var(--line)}
.stat{background:var(--panel);padding:11px 12px}
.stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v.ok{color:var(--ok)} .stat .v.un{color:var(--faint)} .stat .v.wa{color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;padding:14px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bseg{width:100%;border-radius:2px}
.bseg.d{background:var(--ok)} .bseg.s{background:#c8cedb} .bseg.u{background:#eef0f4}
.blab{font-size:9px;color:var(--faint);text-align:center;margin-top:3px}
.lg{display:flex;gap:12px;padding:0 14px 12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
.hbars{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.hb{display:flex;align-items:center;gap:8px;font-size:12px}
.hb .hl{width:88px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .ht{flex:1;height:14px;background:var(--rest);border-radius:3px;overflow:hidden}
.hb .hf{height:100%;background:var(--accent);opacity:.75}
.hb .hv{width:34px;text-align:right;color:var(--faint);font-variant-numeric:tabular-nums}
.empty{padding:22px 14px;text-align:center;color:var(--faint);font-size:13px}
.note{font-size:12px;color:var(--muted);background:var(--soft);border:1px solid #d7ddff;
  border-radius:6px;padding:9px 11px;margin:0 14px 12px}
dialog{border:none;border-radius:12px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.28);max-width:420px;width:92vw}
dialog::backdrop{background:rgba(10,14,25,.42)}
.dlg{padding:18px}
.dlg h4{margin:0 0 4px;font-size:16px}
.dlg p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.dlgrow{display:flex;gap:6px;margin-bottom:9px;align-items:center}
.dlgrow label{font-size:12px;color:var(--muted);width:78px}
.dlgrow input,.dlgrow select{flex:1}
.dlgacts{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:7px 14px;color:var(--muted)}
</style>
</head>
<body>

<div class="top">
  <span class="brand">Planner</span>
  <button class="nav on" data-tab="today">Today</button>
  <button class="nav" data-tab="calendar">Calendar</button>
  <button class="nav" data-tab="blueprint">Blueprint</button>
  <button class="nav" data-tab="insights">Insights</button>
  <span class="clock">
    now <input type="time" id="nowt" value="14:00" title="Simulated clock — proves the honesty rule" />
  </span>
</div>

<div class="wrap" id="app"></div>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

<script type="module">
// ─── calendar core (mirrors src/calendar.mjs) ───────────────────────────────
const EC_MONTHS=["Meskerem","Tikimt","Hidar","Tahsas","Tir","Yekatit","Megabit","Miyazia","Ginbot","Sene","Hamle","Nehase","Pagume"];
const GC_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DOW3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const EC_EPOCH=1724220;
const isEcLeapYear=y=>((y%4)+4)%4===3;
const ecMonthLength=(y,m)=>m===13?(isEcLeapYear(y)?6:5):30;
const gcToJdn=(y,m,d)=>{const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;};
const jdnToGc=j=>{const a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),
  d2=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d2/4),m=Math.floor((5*e+2)/153);
  return{y:100*b+d2-4800+Math.floor(m/10),m:m+3-12*Math.floor(m/10),d:e-Math.floor((153*m+2)/5)+1};};
const ecToJdn=(y,m,d)=>EC_EPOCH+365*(y-1)+Math.floor(y/4)+30*(m-1)+d;
const jdnToEc=j=>{let y=Math.floor((j-EC_EPOCH-1)/365.25)+1;
  while(ecToJdn(y+1,1,1)<=j)y++; while(ecToJdn(y,1,1)>j)y--;
  const doy=j-ecToJdn(y,1,1); return{y,m:Math.floor(doy/30)+1,d:doy%30+1};};
const EC_HOL=[{m:1,d:1,name:"Enkutatash"},{m:1,d:17,name:"Meskel"},{m:4,d:29,name:"Genna"},
  {m:5,d:11,name:"Timkat"},{m:6,d:23,name:"Adwa Victory Day"},{m:8,d:23,name:"Labour Day"},
  {m:8,d:27,name:"Patriots' Day"}];
const GC_HOL=[{m:1,d:1,name:"New Year's Day"},{m:12,d:25,name:"Christmas Day"}];
const iso=({y,m,d})=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const EXTRA={};
const dayFromJdn=j=>{const gc=jdnToGc(j),ec=jdnToEc(j),i=iso(gc);
  const holidays=[...EC_HOL.filter(h=>h.m===ec.m&&h.d===ec.d).map(h=>h.name),
    ...GC_HOL.filter(h=>h.m===gc.m&&h.d===gc.d).map(h=>h.name),...(EXTRA[i]??[])];
  const dow=(j+1)%7;
  return{jdn:j,iso:i,gc,ec,ecMonthName:EC_MONTHS[ec.m-1],gcMonthName:GC_MONTHS[gc.m-1],
    dow,dowName:DOW[dow],isWeekend:dow===0||dow===6,holidays};};
const dayFromGc=(y,m,d)=>dayFromJdn(gcToJdn(y,m,d));
const dayFromEc=(y,m,d)=>dayFromJdn(ecToJdn(y,m,d));
const isGcLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const gcMonthLength=(y,m)=>[31,isGcLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];

// ─── blueprint (mirrors src/blueprint.mjs) ──────────────────────────────────
const firesOn=(r,d)=>{switch(r.kind){
  case"everyday":return true; case"weekday":return !d.isWeekend; case"weekend":return d.isWeekend;
  case"dow":return d.dow===r.dow; case"gc-monthday":return d.gc.d===r.day;
  case"ec-monthday":return d.ec.d===r.day;
  case"holiday":return r.name?d.holidays.includes(r.name):d.holidays.length>0;
  case"dates":return r.dates.includes(d.iso); default:return false;}};
const describeRule=r=>{if(!r)return"One-off";switch(r.kind){
  case"everyday":return"Every day"; case"weekday":return"Every weekday"; case"weekend":return"Every weekend";
  case"dow":return"Every "+DOW[r.dow]; case"gc-monthday":return`Day ${r.day} of each GC month`;
  case"ec-monthday":return`Day ${r.day} of each EC month`;
  case"holiday":return r.name?"Every "+r.name:"Every holiday";
  case"dates":return `${r.dates.length} set date(s)`; default:return"—";}};
const ruleFromFrequency=(f,d)=>({daily:{kind:"everyday"},weekly:{kind:"dow",dow:d.dow},
  monthly:{kind:"gc-monthday",day:d.gc.d},"ec-monthly":{kind:"ec-monthday",day:d.ec.d},
  weekday:{kind:"weekday"},weekend:{kind:"weekend"},once:null})[f]??null;

// ─── log (mirrors src/log.mjs) ──────────────────────────────────────────────
const STATUS={UNKNOWN:"unknown",DONE:"done",SKIPPED:"skipped",RESCHEDULED:"rescheduled"};
const fmtTime=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const parseTime=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s).trim());if(!m)return null;
  const h=+m[1],mi=+m[2];return h>23||mi>59?null:h*60+mi;};
const canCompleteAt=({dayJdn,atMin},now)=>{
  if(dayJdn>now.jdn)return{ok:false,reason:"That day hasn't happened yet."};
  if(dayJdn===now.jdn&&atMin>now.minutes)
    return{ok:false,reason:`It's only ${fmtTime(now.minutes)} — you can't log something at ${fmtTime(atMin)} yet.`};
  return{ok:true};};
const statusOf=(es,taskId,jdn)=>{const f=es.filter(e=>e.taskId===taskId&&e.dayJdn===jdn);
  return f.length?f[f.length-1]:null;};
const GAP={REST:"rest",TRAVEL:"travel"};
const timelineWithGaps=(tasks,{dayStartMin=360,dayEndMin=1380}={})=>{
  const placed=tasks.filter(t=>t.startMin!=null).sort((a,b)=>a.startMin-b.startMin);
  const out=[];let cur=dayStartMin;
  for(const t of placed){const g=t.startMin-cur;
    if(g>0){const prev=out.length?out[out.length-1]:null;
      const moving=prev&&prev.kind==="task"&&prev.task.place&&t.place&&prev.task.place!==t.place;
      out.push({kind:"gap",gapKind:moving?GAP.TRAVEL:GAP.REST,startMin:cur,endMin:t.startMin,
        durationMin:g,from:moving?prev.task.place:null,to:moving?t.place:null});}
    else if(g<0)out.push({kind:"overlap",startMin:t.startMin,endMin:cur,durationMin:-g});
    out.push({kind:"task",task:t,startMin:t.startMin,endMin:t.startMin+(t.duration??0)});
    cur=Math.max(cur,t.startMin+(t.duration??0));}
  if(cur<dayEndMin)out.push({kind:"gap",gapKind:GAP.REST,startMin:cur,endMin:dayEndMin,
    durationMin:dayEndMin-cur,from:null,to:null});
  return out;};
const summarise=(bp,entries,jdn)=>{let done=0,skipped=0,unknown=0,resch=0,plannedMin=0,actualMin=0;
  for(const t of bp){plannedMin+=t.duration??0;const e=statusOf(entries,t.id,jdn);
    if(!e){unknown++;continue}
    if(e.status===STATUS.DONE){done++;actualMin+=e.durationMin??t.duration??0}
    else if(e.status===STATUS.SKIPPED)skipped++; else if(e.status===STATUS.RESCHEDULED)resch++; else unknown++;}
  const unp=entries.filter(e=>e.dayJdn===jdn&&e.unplanned&&e.status===STATUS.DONE);
  for(const e of unp)actualMin+=e.durationMin??0;
  const answered=done+skipped+resch;
  return{done,skipped,unknown,rescheduled:resch,unplannedCount:unp.length,plannedMin,actualMin,
    answered,adherence:answered===0?null:done/answered};};

// ─── state ──────────────────────────────────────────────────────────────────
let uid=0;const nid=p=>`${p}${++uid}`;
const TODAY=dayFromGc(2026,8,14);
let nowMin=14*60;
let selJdn=TODAY.jdn;
let tab="today";
let calMode="ec";
let calAnchor={ec:{...jdnToEc(TODAY.jdn)},gc:{...jdnToGc(TODAY.jdn)}};
let bpFilter="all";

const tasks=[];const entries=[];
const T=(title,rule,startMin,duration,place,extra={})=>{
  const t={id:nid("t"),title,rule,startMin,duration,place,note:"",...extra};tasks.push(t);return t;};

T("Wake & stretch",{kind:"everyday"},360,20,"Home");
T("Breakfast",{kind:"everyday"},390,30,"Home");
T("Commute",{kind:"weekday"},480,40,"Transit");
T("Team standup",{kind:"weekday"},540,15,"Office");
T("Deep work",{kind:"weekday"},570,150,"Office");
T("Lunch",{kind:"everyday"},750,45,"Office");
T("Emails & admin",{kind:"weekday"},840,45,"Office");
T("Deep work II",{kind:"weekday"},900,120,"Office");
T("Commute home",{kind:"weekday"},1050,40,"Transit");
T("Evening walk",{kind:"everyday"},1140,30,"Outside");
T("Dinner",{kind:"everyday"},1200,45,"Home");
T("Read",{kind:"everyday"},1290,30,"Home");
T("Long ride",{kind:"weekend"},480,150,"Outside");
T("House clean",{kind:"weekend"},720,90,"Home");
T("Grocery run",{kind:"weekend"},900,60,"Store");
T("Weekly review",{kind:"dow",dow:0},1020,45,"Home");
T("Pay rent",{kind:"gc-monthday",day:1},600,20,"Home");
T("Family call",{kind:"ec-monthday",day:1},1140,40,"Home");
T("Holiday feast",{kind:"holiday"},780,180,"Home");

// Seed a plausible history so the graphs have something honest to show.
(()=>{
  for(let back=1;back<=13;back++){
    const j=TODAY.jdn-back;const d=dayFromJdn(j);
    const bp=tasks.filter(t=>t.rule&&firesOn(t.rule,d));
    // Older days are only partly reviewed — blanks are realistic, not failures.
    const coverage=back<=6?0.85:0.45;
    bp.forEach((t,i)=>{
      const r=((j*31+i*17)%100)/100;
      if(r>coverage)return;
      const good=((j*13+i*7)%100)/100;
      if(good<0.72)entries.push({id:nid("e"),taskId:t.id,dayJdn:j,status:STATUS.DONE,
        atMin:t.startMin+(((j+i)%5)-2)*10,durationMin:t.duration,unplanned:false,note:""});
      else if(good<0.9)entries.push({id:nid("e"),taskId:t.id,dayJdn:j,status:STATUS.SKIPPED,
        atMin:null,durationMin:null,unplanned:false,note:""});
    });
    if(back%4===0)entries.push({id:nid("e"),taskId:nid("x"),dayJdn:j,status:STATUS.DONE,
      atMin:960,durationMin:40,unplanned:true,note:"Unplanned errand",title:"Unplanned errand"});
  }
})();
// A couple of entries for today, before the simulated clock.
entries.push({id:nid("e"),taskId:tasks[0].id,dayJdn:TODAY.jdn,status:STATUS.DONE,atMin:365,durationMin:20,unplanned:false,note:""});
entries.push({id:nid("e"),taskId:tasks[1].id,dayJdn:TODAY.jdn,status:STATUS.DONE,atMin:395,durationMin:25,unplanned:false,note:""});

const now=()=>({jdn:TODAY.jdn,minutes:nowMin});
const selDay=()=>dayFromJdn(selJdn);
const bpFor=d=>tasks.filter(t=>t.rule&&firesOn(t.rule,d)).sort((a,b)=>(a.startMin??0)-(b.startMin??0));
const oneOffsFor=d=>tasks.filter(t=>!t.rule&&t.onJdn===d.jdn).sort((a,b)=>(a.startMin??0)-(b.startMin??0));
const dayTasks=d=>[...bpFor(d),...oneOffsFor(d)].sort((a,b)=>(a.startMin??0)-(b.startMin??0));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

// ─── actions ────────────────────────────────────────────────────────────────
function setStatus(taskId,jdn,status,atMin,durationMin){
  if(status===STATUS.DONE){
    const chk=canCompleteAt({dayJdn:jdn,atMin:atMin??0},now());
    if(!chk.ok){toast("Can't log that yet",chk.reason);return false}
  }
  const prev=statusOf(entries,taskId,jdn);
  if(prev&&prev.status===status){ // toggle back to blank — blank is a real state
    entries.splice(entries.indexOf(prev),1);render();return true;
  }
  entries.push({id:nid("e"),taskId,dayJdn:jdn,status,atMin:atMin??null,
    durationMin:durationMin??null,unplanned:false,note:""});
  render();return true;
}
function toast(title,msg){
  $("dlgbody").innerHTML=`<h4>${esc(title)}</h4><p>${esc(msg)}</p>
    <div class="dlgacts"><button class="go" id="ok">Got it</button></div>`;
  $("dlg").showModal();$("ok").onclick=()=>$("dlg").close();
}
function logUnplanned(){
  const d=selDay();
  $("dlgbody").innerHTML=`<h4>Log something you actually did</h4>
    <p>It wasn't planned — that's fine. This records reality, it doesn't score you.</p>
    <div class="dlgrow"><label>What</label><input id="u_t" placeholder="e.g. Fixed the sink" /></div>
    <div class="dlgrow"><label>At</label><input id="u_at" type="time" value="${fmtTime(Math.min(nowMin,1380))}" /></div>
    <div class="dlgrow"><label>Minutes</label><input id="u_d" type="number" value="30" min="0" step="5" /></div>
    <div class="dlgacts"><button class="ghost" id="c">Cancel</button><button class="go" id="s">Log it</button></div>`;
  $("dlg").showModal();
  $("c").onclick=()=>$("dlg").close();
  $("s").onclick=()=>{
    const title=$("u_t").value.trim();if(!title)return;
    const at=parseTime($("u_at").value)??0;
    const chk=canCompleteAt({dayJdn:d.jdn,atMin:at},now());
    if(!chk.ok){toast("Can't log that yet",chk.reason);return}
    entries.push({id:nid("e"),taskId:nid("x"),dayJdn:d.jdn,status:STATUS.DONE,atMin:at,
      durationMin:+$("u_d").value||0,unplanned:true,note:"",title});
    $("dlg").close();render();
  };
}
function reschedule(taskId,jdn){
  $("dlgbody").innerHTML=`<h4>Reschedule</h4>
    <p>Moving it isn't failing. Say when it's actually going to happen.</p>
    <div class="dlgrow"><label>Move to</label><input id="r_d" type="date" value="${dayFromJdn(jdn+1).iso}" /></div>
    <div class="dlgacts"><button class="ghost" id="c">Cancel</button><button class="go" id="s">Move</button></div>`;
  $("dlg").showModal();$("c").onclick=()=>$("dlg").close();
  $("s").onclick=()=>{const [y,m,dd]=$("r_d").value.split("-").map(Number);
    entries.push({id:nid("e"),taskId,dayJdn:jdn,status:STATUS.RESCHEDULED,atMin:null,
      durationMin:null,unplanned:false,note:"",movedToJdn:gcToJdn(y,m,dd)});
    $("dlg").close();render();};
}

// ─── views ──────────────────────────────────────────────────────────────────
function slotHtml(t,d,cls){
  const e=statusOf(entries,t.id,d.jdn);
  const st=e?e.status:STATUS.UNKNOWN;
  const future=d.jdn>now().jdn||(d.jdn===now().jdn&&(t.startMin??0)>nowMin);
  const doneAt=e&&e.status===STATUS.DONE&&e.atMin!=null&&e.atMin!==t.startMin;
  return `<div class="slot ${cls}">
    <div class="t">${t.startMin!=null?fmtTime(t.startMin):"—"}</div>
    <div class="body">
      <div class="ttl ${st===STATUS.DONE?"done":""}">${esc(t.title)}
        ${t.rule?`<span class="badge bp">blueprint</span>`:`<span class="badge">one-off</span>`}
        ${st===STATUS.UNKNOWN?`<span class="badge unk">no answer yet</span>`:""}
        ${st===STATUS.RESCHEDULED?`<span class="badge unp">moved</span>`:""}
      </div>
      <div class="meta">${t.duration??0}m${t.place?` · ${esc(t.place)}`:""}${
        doneAt?` · <b>actually ${fmtTime(e.atMin)}</b>`:""}</div>
    </div>
    <div class="acts">
      <button class="mini ${st===STATUS.DONE?"on-done":""}" data-done="${t.id}" data-jdn="${d.jdn}"
        data-at="${t.startMin??0}" data-dur="${t.duration??0}" ${future&&st!==STATUS.DONE?"disabled title='Not yet — it hasn\\'t happened'":""}>done</button>
      <button class="mini ${st===STATUS.SKIPPED?"on-skip":""}" data-skip="${t.id}" data-jdn="${d.jdn}">no</button>
      <button class="mini" data-resc="${t.id}" data-jdn="${d.jdn}">↷</button>
    </div>
  </div>`;
}

function viewToday(){
  const d=selDay();
  const list=dayTasks(d);
  const line=timelineWithGaps(list);
  const isToday=d.jdn===TODAY.jdn;
  const s=summarise(bpFor(d),entries,d.jdn);
  const unp=entries.filter(e=>e.dayJdn===d.jdn&&e.unplanned);

  let rows="";
  for(const seg of line){
    if(seg.kind==="gap"){
      if(seg.durationMin<15)continue;
      const lbl=seg.gapKind===GAP.TRAVEL
        ? `travel ${esc(seg.from)} → ${esc(seg.to)} · ${seg.durationMin}m`
        : `rest / open · ${seg.durationMin}m`;
      rows+=`<div class="gap ${seg.gapKind}"><div class="t">${fmtTime(seg.startMin)}</div><div>${lbl}</div></div>`;
    } else if(seg.kind==="overlap"){
      rows+=`<div class="gap overlap"><div class="t">${fmtTime(seg.startMin)}</div>
        <div>overlap · ${seg.durationMin}m double-booked</div></div>`;
    } else {
      const t=seg.task;
      const cur=isToday&&t.startMin<=nowMin&&nowMin<t.startMin+(t.duration??0);
      const past=isToday&&t.startMin+(t.duration??0)<=nowMin;
      rows+=slotHtml(t,d,cur?"current":past?"past":"");
    }
  }
  const unpRows=unp.map(e=>`<div class="slot">
    <div class="t">${e.atMin!=null?fmtTime(e.atMin):"—"}</div>
    <div class="body"><div class="ttl">${esc(e.title??"Unplanned")}
      <span class="badge unp">unplanned</span></div>
      <div class="meta">${e.durationMin??0}m · logged after the fact</div></div></div>`).join("");

  return `<div class="hd">
      <div>
        <h1>${isToday?"Today":d.dowName}${d.holidays.length?`<span class="hol">${esc(d.holidays[0])}</span>`:""}</h1>
        <p class="dual"><b>${d.ec.d} ${d.ecMonthName} ${d.ec.y}</b> EC · ${d.gc.d} ${d.gcMonthName} ${d.gc.y} GC · ${d.dowName}</p>
      </div>
    </div>
    <p class="sub">The blueprint is the ideal. What you log is reality. The difference is information, not a score.</p>
    <div class="grid">
      <div>
        <div class="card" style="margin-bottom:16px">
          <h3>The day <span class="r">${list.length} planned${isToday?` · now ${fmtTime(nowMin)}`:""}</span></h3>
          <div class="strip">${rows||'<div class="empty">Nothing planned. A blank day is a valid day.</div>'}</div>
        </div>
        ${unp.length?`<div class="card" style="margin-bottom:16px">
          <h3>Also happened <span class="r">not planned — still counts</span></h3>
          <div class="strip">${unpRows}</div></div>`:""}
        <div class="card">
          <h3>Quick add</h3>
          <div class="pad">
            <div class="qa">
              <input type="text" id="q_t" placeholder="Add a task…" />
              <input type="time" id="q_at" value="${fmtTime(Math.min(nowMin+30,1380))}" />
              <input type="number" id="q_d" value="30" min="0" step="5" title="minutes" />
              <button class="go" id="q_add">Add</button>
            </div>
            <button class="more" id="q_more">+ more detail</button>
            <div class="det" id="q_det">
              <select id="q_f">
                <option value="once">once — just this day</option>
                <option value="daily">every day</option>
                <option value="weekday">every weekday</option>
                <option value="weekend">every weekend</option>
                <option value="weekly">every ${d.dowName}</option>
                <option value="monthly">day ${d.gc.d} each GC month</option>
                <option value="ec-monthly">day ${d.ec.d} each EC month</option>
              </select>
              <input type="text" id="q_p" placeholder="place (enables travel gaps)" />
            </div>
            <button class="more" id="q_unp">✓ I did something that wasn't planned</button>
          </div>
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <h3>How the day went</h3>
          <div class="stats">
            <div class="stat"><div class="k">Done</div><div class="v ok">${s.done}</div></div>
            <div class="stat"><div class="k">Said no</div><div class="v">${s.skipped}</div></div>
            <div class="stat"><div class="k">No answer</div><div class="v un">${s.unknown}</div></div>
            <div class="stat"><div class="k">Unplanned</div><div class="v wa">${s.unplannedCount}</div></div>
          </div>
          <div class="note">${s.answered===0
            ? "Nothing answered yet. That's not a failure — it just means no information."
            : `Of the ${s.answered} you answered, ${s.done} got done. ${s.unknown} still blank.`}</div>
        </div>
        ${calendarCard(true)}
      </div>
    </div>`;
}

function calendarCard(compact){
  const mode=calMode;
  let cells=[],title="",sub="";
  if(mode==="ec"){
    const {y,m}=calAnchor.ec;
    title=`${EC_MONTHS[m-1]} ${y}`;
    const len=ecMonthLength(y,m);
    const first=dayFromEc(y,m,1);
    sub=`${first.gcMonthName} ${first.gc.y} GC`;
    for(let i=0;i<first.dow;i++)cells.push(null);
    for(let i=1;i<=len;i++)cells.push(dayFromEc(y,m,i));
  } else {
    const {y,m}=calAnchor.gc;
    title=`${GC_MONTHS[m-1]} ${y}`;
    const len=gcMonthLength(y,m);
    const first=dayFromGc(y,m,1);
    sub=`${first.ecMonthName} ${first.ec.y} EC`;
    for(let i=0;i<first.dow;i++)cells.push(null);
    for(let i=1;i<=len;i++)cells.push(dayFromGc(y,m,i));
  }
  const daysHtml=cells.map(d=>{
    if(!d)return `<div></div>`;
    const n=mode==="ec"?d.ec.d:d.gc.d;
    const alt=mode==="ec"?d.gc.d:d.ec.d;
    const cnt=bpFor(d).length;
    return `<button class="day ${d.jdn===selJdn?"sel":""} ${d.jdn===TODAY.jdn?"today":""}
      ${d.isWeekend?"wknd":""} ${d.holidays.length?"hol":""}" data-jdn="${d.jdn}"
      title="${esc(d.dowName)}${d.holidays.length?" · "+esc(d.holidays.join(", ")):""}">
      <span class="n">${n}</span><span class="alt">${alt}</span>
      ${cnt?`<span class="dot"></span>`:""}</button>`;
  }).join("");
  return `<div class="card">
    <div class="calhd">
      <button class="arrow" data-cal="-1">‹</button>
      <div class="nm">${title}<span>${sub}</span></div>
      <button class="arrow" data-cal="1">›</button>
    </div>
    <div class="dows">${DOW3.map(x=>`<div>${x}</div>`).join("")}</div>
    <div class="days">${daysHtml}</div>
    <div class="swapcal">
      <button class="${mode==="ec"?"on":""}" data-mode="ec">Ethiopian first</button>
      <button class="${mode==="gc"?"on":""}" data-mode="gc">Gregorian first</button>
    </div>
  </div>`;
}

function viewCalendar(){
  const d=selDay();
  const list=dayTasks(d);
  return `<div class="hd"><div>
      <h1>Calendar</h1>
      <p class="dual">Both systems, one grid. Big number is the primary calendar, small is the other.</p>
    </div></div>
    <p class="sub">Pick any day to see what you do on it. Red dot = holiday · blue bar = has blueprint tasks.</p>
    <div class="grid">
      <div>${calendarCard(false)}</div>
      <div class="card">
        <h3>${d.ec.d} ${d.ecMonthName} ${d.ec.y} EC <span class="r">${d.gc.d} ${d.gcMonthName} ${d.gc.y}</span></h3>
        ${d.holidays.length?`<div class="note">${esc(d.holidays.join(" · "))}</div>`:""}
        <div class="strip">${list.length?list.map(t=>slotHtml(t,d,"")).join("")
          :'<div class="empty">Nothing on this day.</div>'}</div>
      </div>
    </div>`;
}

function viewBlueprint(){
  const kinds=[["all","All"],["everyday","Every day"],["weekday","Weekdays"],["weekend","Weekends"],
    ["dow","By weekday"],["gc-monthday","GC monthly"],["ec-monthday","EC monthly"],["holiday","Holidays"]];
  const shown=tasks.filter(t=>t.rule&&(bpFilter==="all"||t.rule.kind===bpFilter));
  const groups={};
  for(const t of shown){const k=describeRule(t.rule);(groups[k]??=[]).push(t)}
  const body=Object.entries(groups).map(([k,ts])=>`
    <div class="bpitem" style="background:var(--bg);font-weight:600;font-size:12px;color:var(--muted)">
      ${esc(k)} · ${ts.length}</div>
    ${ts.sort((a,b)=>(a.startMin??0)-(b.startMin??0)).map(t=>`<div class="bpitem">
      <div class="t" style="width:44px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">
        ${t.startMin!=null?fmtTime(t.startMin):"—"}</div>
      <div class="w"><div>${esc(t.title)}</div>
        <div style="font-size:12px;color:var(--faint)">${t.duration}m${t.place?` · ${esc(t.place)}`:""}</div></div>
      <button class="mini" data-delbp="${t.id}">remove</button>
    </div>`).join("")}`).join("");
  return `<div class="hd"><div>
      <h1>Blueprint</h1>
      <p class="dual">What you always do, on each kind of day.</p>
    </div></div>
    <p class="sub">Add a task with a recurring frequency anywhere and it lands here automatically.</p>
    <div class="card">
      <div class="kinds">${kinds.map(([k,l])=>
        `<button class="${bpFilter===k?"on":""}" data-bpf="${k}">${l}</button>`).join("")}</div>
      ${body||'<div class="empty">No blueprint rules of this kind yet.</div>'}
    </div>`;
}

function viewInsights(){
  const days=[];
  for(let back=13;back>=0;back--){
    const j=TODAY.jdn-back,d=dayFromJdn(j);
    days.push({d,s:summarise(bpFor(d),entries,j)});
  }
  const maxN=Math.max(1,...days.map(x=>x.s.done+x.s.skipped+x.s.unknown));
  const bars=days.map(({d,s})=>{
    const tot=s.done+s.skipped+s.unknown||1;
    const h=(n)=>`${(n/maxN)*100}%`;
    return `<div class="bar" title="${d.iso}: ${s.done} done, ${s.skipped} no, ${s.unknown} blank">
      <div class="bseg u" style="height:${h(s.unknown)}"></div>
      <div class="bseg s" style="height:${h(s.skipped)}"></div>
      <div class="bseg d" style="height:${h(s.done)}"></div>
    </div>`;}).join("");
  const labs=days.map(({d})=>`<div class="blab">${d.gc.d}</div>`).join("");

  // Time actually spent, by place — only from real logged entries.
  const byPlace={};
  for(const e of entries){
    if(e.status!==STATUS.DONE)continue;
    const t=tasks.find(x=>x.id===e.taskId);
    const p=t?.place??"Unplanned";
    byPlace[p]=(byPlace[p]??0)+(e.durationMin??t?.duration??0);
  }
  const places=Object.entries(byPlace).sort((a,b)=>b[1]-a[1]);
  const maxP=Math.max(1,...places.map(p=>p[1]));

  // Which blueprint rules actually hold up
  const byRule={};
  for(const t of tasks.filter(x=>x.rule)){
    const k=describeRule(t.rule);
    const st=(byRule[k]??={done:0,ans:0});
    for(const e of entries.filter(e=>e.taskId===t.id)){
      if(e.status===STATUS.DONE){st.done++;st.ans++}
      else if(e.status===STATUS.SKIPPED)st.ans++;
    }
  }
  const rules=Object.entries(byRule).filter(([,v])=>v.ans>0)
    .sort((a,b)=>(b[1].done/b[1].ans)-(a[1].done/a[1].ans));

  const totals=days.reduce((a,x)=>({done:a.done+x.s.done,skipped:a.skipped+x.s.skipped,
    unknown:a.unknown+x.s.unknown,unp:a.unp+x.s.unplannedCount}),{done:0,skipped:0,unknown:0,unp:0});

  return `<div class="hd"><div><h1>Insights</h1>
    <p class="dual">Built only from what you actually logged.</p></div></div>
    <p class="sub">Blank days are shown as blank — never counted as failure.</p>
    <div class="grid">
      <div>
        <div class="card" style="margin-bottom:16px">
          <h3>Last 14 days <span class="r">${totals.done} done · ${totals.unknown} unanswered</span></h3>
          <div class="bars">${bars}</div>
          <div style="display:grid;grid-template-columns:repeat(14,1fr);padding:0 14px">${labs}</div>
          <div class="lg">
            <span><i class="bseg d" style="background:var(--ok)"></i>done</span>
            <span><i class="bseg s" style="background:#c8cedb"></i>said no</span>
            <span><i class="bseg u" style="background:#eef0f4"></i>no answer</span>
          </div>
        </div>
        <div class="card">
          <h3>Where the time actually went</h3>
          ${places.length?`<div class="hbars">${places.map(([p,m])=>`<div class="hb">
            <div class="hl">${esc(p)}</div>
            <div class="ht"><div class="hf" style="width:${(m/maxP)*100}%"></div></div>
            <div class="hv">${m>=60?(m/60).toFixed(1)+"h":m+"m"}</div></div>`).join("")}</div>`
            :'<div class="empty">Nothing logged yet.</div>'}
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <h3>Which routines hold up</h3>
          ${rules.length?`<div class="hbars">${rules.map(([k,v])=>`<div class="hb">
            <div class="hl" title="${esc(k)}">${esc(k)}</div>
            <div class="ht"><div class="hf" style="width:${(v.done/v.ans)*100}%"></div></div>
            <div class="hv">${Math.round((v.done/v.ans)*100)}%</div></div>`).join("")}</div>`
            :'<div class="empty">Not enough answers yet.</div>'}
          <div class="note">Percentages count only occurrences you answered. Blanks are excluded, so an unreviewed week can't drag a routine down.</div>
        </div>
        <div class="card">
          <h3>Totals</h3>
          <div class="stats">
            <div class="stat"><div class="k">Done</div><div class="v ok">${totals.done}</div></div>
            <div class="stat"><div class="k">Said no</div><div class="v">${totals.skipped}</div></div>
            <div class="stat"><div class="k">Blank</div><div class="v un">${totals.unknown}</div></div>
            <div class="stat"><div class="k">Unplanned</div><div class="v wa">${totals.unp}</div></div>
          </div>
        </div>
      </div>
    </div>`;
}

function render(){
  document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  $("app").innerHTML= tab==="today"?viewToday() : tab==="calendar"?viewCalendar()
    : tab==="blueprint"?viewBlueprint() : viewInsights();
  wire();
}

function wire(){
  const add=$("q_add");
  if(add){
    const doAdd=()=>{
      const title=$("q_t").value.trim();if(!title)return;
      const d=selDay();
      const f=$("q_f")?$("q_f").value:"once";
      const rule=ruleFromFrequency(f,d);
      const t={id:nid("t"),title,rule,startMin:parseTime($("q_at").value)??nowMin,
        duration:+$("q_d").value||0,place:($("q_p")?.value.trim())||null,note:""};
      if(!rule)t.onJdn=d.jdn;
      tasks.push(t);render();
    };
    add.onclick=doAdd;
    $("q_t").onkeydown=e=>{if(e.key==="Enter")doAdd()};
    $("q_more").onclick=()=>$("q_det").classList.toggle("show");
    $("q_unp").onclick=logUnplanned;
  }
}

document.body.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();return}
  if(b.dataset.jdn&&b.classList.contains("day")){selJdn=+b.dataset.jdn;render();return}
  if(b.dataset.cal){
    const dir=+b.dataset.cal;
    if(calMode==="ec"){let{y,m}=calAnchor.ec;m+=dir;if(m>13){m=1;y++}if(m<1){m=13;y--}calAnchor.ec={y,m}}
    else{let{y,m}=calAnchor.gc;m+=dir;if(m>12){m=1;y++}if(m<1){m=12;y--}calAnchor.gc={y,m}}
    render();return;
  }
  if(b.dataset.mode){calMode=b.dataset.mode;render();return}
  if(b.dataset.bpf){bpFilter=b.dataset.bpf;render();return}
  if(b.dataset.done){setStatus(b.dataset.done,+b.dataset.jdn,STATUS.DONE,+b.dataset.at,+b.dataset.dur);return}
  if(b.dataset.skip){setStatus(b.dataset.skip,+b.dataset.jdn,STATUS.SKIPPED);return}
  if(b.dataset.resc){reschedule(b.dataset.resc,+b.dataset.jdn);return}
  if(b.dataset.delbp){const i=tasks.findIndex(t=>t.id===b.dataset.delbp);if(i>=0)tasks.splice(i,1);render();return}
});
$("nowt").addEventListener("change",e=>{const v=parseTime(e.target.value);
  if(v!=null){nowMin=v;render()}});

render();
</script>
</body>
</html>
